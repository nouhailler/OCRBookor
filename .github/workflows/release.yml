name: Release & Publish Binary

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v1.3.0)'
        required: true
        default: 'v1.3.0'

permissions:
  contents: write

jobs:
  build-and-release:
    name: Build & Publish Release
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev binutils

      - name: Install dependencies & Build frontend
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Run E2E and Unit Tests
        run: |
          chmod +x scripts/*.sh
          ./scripts/test-e2e.sh

      - name: Build Debian Package (.deb)
        run: |
          ./scripts/build-deb.sh
          ls -lh releases/

      - name: Compute SHA256 Checksum
        run: |
          cd releases
          sha256sum *.deb > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.tag_name || (github.ref_type == 'tag' && github.ref_name) || 'v1.3.0' }}
          name: OCRBookor ${{ github.event.inputs.tag_name || (github.ref_type == 'tag' && github.ref_name) || 'v1.3.0' }}
          body: |
            ## 🚀 OCRBookor v1.3.0 — Release Bilingue (FR/EN) & PWA Landing

            Application locale de numérisation, reconnaissance OCR et reconstruction éditoriale de livres imprimés vers EPUB 3, Markdown, TXT et HTML.

            ### 📦 Fichiers téléchargeables
            - **`ocrbookor_1.3.0_amd64.deb`** : Paquet d'installation natif Debian / Ubuntu x86_64.
            - **`SHA256SUMS.txt`** : Empreintes cryptographiques de vérification d'intégrité.

            ### ⚡ Installation Express en 1 ligne
            ```bash
            curl -sSL https://raw.githubusercontent.com/nouhailler/OCRBookor/main/install.sh | sudo bash
            ```

            ### 🔧 Installation Manuelle sur Linux Desktop
            ```bash
            sudo dpkg -i ocrbookor_1.3.0_amd64.deb
            sudo apt-get install -f
            ocrbookor
            ```

            ### 🌟 Nouveautés v1.3.0
            - 🌐 **Internationalisation Complète (i18n) :** Interface intégrale en français et anglais avec sélecteur instantané.
            - 📱 **Landing Page PWA Bilingue :** Version anglaise autonome (`/en`) sur Cloudflare Pages avec support hors-ligne.
            - 🚀 **Script d'installation `curl` :** Automatisation du déploiement binaire sur Debian / Ubuntu.
            - 📚 **Documentation Bilingue :** `README.en.md` et rapport `docs/INTERNATIONALIZATION_EN_REPORT.md`.
            - 🧪 **Suite de tests i18n automatisée :** Parité 100% (444 clés vérifiées).
          files: |
            releases/*.deb
            releases/SHA256SUMS.txt
          draft: false
          prerelease: false
