name: Release & Publish Binaries

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:
    inputs:
      tag_name:
        description: 'Tag name for the release (e.g. v1.4.0)'
        required: true
        default: 'v1.4.0'

permissions:
  contents: write

jobs:
  build-linux-and-packages:
    name: Build Linux (.deb), Windows & macOS Packages
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Debian packaging tools
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev binutils

      - name: Install dependencies & Build frontend
        run: |
          npm install --legacy-peer-deps
          npm run build

      - name: Run E2E and Unit Tests
        run: |
          chmod +x scripts/*.sh
          ./scripts/test-e2e.sh
          npm test

      - name: Build Debian Package (.deb)
        run: |
          bash ./scripts/build-deb.sh
          ls -lh releases/

      - name: Build Windows Portable Zip
        run: |
          node scripts/build-windows.mjs
          ls -lh releases/

      - name: Build macOS Universal Packages (.zip & .tar.gz)
        run: |
          node scripts/build-macos.mjs
          ls -lh releases/

      - name: Upload Release Staging Artifacts
        uses: actions/upload-artifact@v4
        with:
          name: release-staging
          path: releases/

  build-windows-installer:
    name: Build Windows Installer (.exe)
    needs: build-linux-and-packages
    runs-on: windows-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download Staging Artifacts from Linux Build
        uses: actions/download-artifact@v4
        with:
          name: release-staging
          path: releases

      - name: Install Inno Setup Compiler
        run: |
          choco install innosetup --yes

      - name: Compile Inno Setup Windows Installer (.exe)
        run: |
          if (Test-Path 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe') {
            & 'C:\Program Files (x86)\Inno Setup 6\ISCC.exe' scripts\windows\ocrbookor-installer.iss
          } elseif (Get-Command iscc -ErrorAction SilentlyContinue) {
            iscc scripts\windows\ocrbookor-installer.iss
          } else {
            throw "ISCC.exe introuvable après installation Inno Setup."
          }

      - name: Verify Installer Exists
        run: |
          Get-ChildItem -Path releases -Filter "*.exe"

      - name: Upload Windows Installer Artifact
        uses: actions/upload-artifact@v4
        with:
          name: windows-installer-artifact
          path: releases/*_setup_x64.exe

  publish-release:
    name: Publish GitHub Release
    needs: [build-linux-and-packages, build-windows-installer]
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Download all release artifacts
        uses: actions/download-artifact@v4
        with:
          path: releases-download
          merge-multiple: true

      - name: Assemble Release Assets & Compute Checksums
        run: |
          mkdir -p releases
          cp -f releases-download/*.deb releases/ 2>/dev/null || true
          cp -f releases-download/*.zip releases/ 2>/dev/null || true
          cp -f releases-download/*.tar.gz releases/ 2>/dev/null || true
          cp -f releases-download/*.exe releases/ 2>/dev/null || true
          cd releases
          ls -la
          sha256sum ocrbookor_1.4.0*.deb ocrbookor_1.4.0*.zip ocrbookor_1.4.0*.tar.gz ocrbookor_1.4.0*.exe > SHA256SUMS.txt 2>/dev/null || sha256sum *.* > SHA256SUMS.txt
          cat SHA256SUMS.txt

      - name: Create GitHub Release and Upload Assets
        uses: softprops/action-gh-release@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tag_name: ${{ github.event.inputs.tag_name || (github.ref_type == 'tag' && github.ref_name) || 'v1.4.0' }}
          name: OCRBookor ${{ github.event.inputs.tag_name || (github.ref_type == 'tag' && github.ref_name) || 'v1.4.0' }}
          body: |
            ## 🚀 OCRBookor v1.4.0 — Release Tri-Plateforme (Linux, Windows & macOS) & PWA

            Application locale et souveraine de numérisation, reconnaissance OCR et reconstruction éditoriale de livres imprimés vers EPUB 3, Markdown, TXT et HTML.

            ---

            ### 📦 Fichiers et Installateurs Téléchargeables

            | Plateforme | Type | Fichier | Description |
            | :--- | :--- | :--- | :--- |
            | **macOS (Universal)** | 🍎 **Archive Finder macOS** | **`ocrbookor_1.4.0_macos_universal.zip`** | Version autonome pour Apple Silicon (M1/M2/M3/M4) et Intel avec lanceur `ocrbookor.command`. |
            | **macOS (Universal)** | 🍏 **Archive Tarball** | **`ocrbookor_1.4.0_macos_universal.tar.gz`** | Archive Unix préservant les droits d'exécution `chmod 755`. |
            | **Windows (x64)** | 🪟 **Installateur .exe** | **`ocrbookor_1.4.0_setup_x64.exe`** | Assistant d'installation officiel Inno Setup avec raccourci Bureau et menu Démarrer. |
            | **Windows (x64)** | 📦 **Archive Portable .zip** | **`ocrbookor_1.4.0_win_x64.zip`** | Version autonome zéro-installation avec lanceur `ocrbookor.cmd`. |
            | **Linux (amd64)** | 🐧 **Paquet natif .deb** | **`ocrbookor_1.4.0_amd64.deb`** | Pour Debian 12/13, Ubuntu 22.04/24.04 LTS et dérivés. |
            | **Vérification** | 🔒 **Checksums SHA256** | **`SHA256SUMS.txt`** | Empreintes cryptographiques d'intégrité binaire. |

            ---

            ### ⚡ Installation Express en 1 Ligne

            #### 🍎 macOS Desktop (Terminal en 1 ligne)
            ```bash
            curl -sSL https://raw.githubusercontent.com/nouhailler/OCRBookor/main/scripts/macos/install-macos.sh | bash
            ```

            #### 🪟 Windows Desktop (PowerShell en 1 ligne)
            ```powershell
            irm https://raw.githubusercontent.com/nouhailler/OCRBookor/main/scripts/windows/install-windows.ps1 | iex
            ```

            #### 🐧 Linux Debian / Ubuntu (Terminal en 1 ligne)
            ```bash
            curl -sSL https://raw.githubusercontent.com/nouhailler/OCRBookor/main/install.sh | sudo bash
            ```

            ---

            ### 🔧 Démarrage Rapide sous macOS
            1. Téléchargez **`ocrbookor_1.4.0_macos_universal.zip`**.
            2. Double-cliquez pour décompresser l'archive dans vos Téléchargements ou Applications.
            3. Double-cliquez sur **`ocrbookor.command`** dans le Finder.
            4. Votre navigateur par défaut s'ouvre automatiquement sur `http://localhost:3000`.

            ---

            ### 🌟 Nouveautés v1.4.0
            - 🍎 **Support Complet macOS (Apple Silicon & Intel) :** Lanceur natif `ocrbookor.command`, script d'installation en 1 ligne pour macOS, gestion du dossier `~/Library/Application Support/OCRBookor` et détection des interpréteurs Python Homebrew (`/opt/homebrew/bin/python3` et `/usr/local/bin/python3`).
            - 🛡️ **Gestion Conditionnelle des Dépendances Natives :** Éradication du bug npm #4828 via le hook `install-platform-deps.mjs`.
            - 🪟 **Support Natif Windows :** Installateur exécutable `.exe` Inno Setup, archive portable `.zip` et script PowerShell.
            - 🌐 **Internationalisation Complète (i18n) :** Interface bilingue intégrale en français et anglais avec sélecteur instantané.
            - 📱 **Landing Page PWA Bilingue :** Version autonome (`/en`) sur Cloudflare Pages avec mise en cache hors-ligne.
            - 🧪 **Suite de Tests et Validation :** Tests E2E de conversion et 444 clés de traduction vérifiées.
          files: |
            releases/*.deb
            releases/*.exe
            releases/*.zip
            releases/*.tar.gz
            releases/SHA256SUMS.txt
          draft: false
          prerelease: false
